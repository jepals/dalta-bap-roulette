<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달타를 위한 배달음식 랜덤 뽑기</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7f8;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f7f8}#win{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,22,24,.46);backdrop-filter:blur(5px)}#win.show{display:flex;animation:fade .2s ease}.box{position:relative;width:min(92vw,540px);text-align:center;background:linear-gradient(145deg,#fff,#edfffd);border:4px solid #ffd54a;border-radius:30px;padding:30px 22px 24px;box-shadow:0 26px 90px #0005;animation:pop .65s cubic-bezier(.17,.89,.25,1.35);overflow:hidden}.box:before,.box:after{content:"✨";position:absolute;top:15px;font-size:52px;animation:spark 1s ease-in-out infinite alternate}.box:before{left:20px}.box:after{right:20px;animation-delay:.25s}.title{font-size:18px;font-weight:1000;color:#159f9a;letter-spacing:.08em}.cat{margin-top:9px;font-size:15px;font-weight:900;color:#687477}.food{margin:8px 0 10px;font-size:clamp(44px,10vw,72px);line-height:1.02;font-weight:1000;word-break:keep-all;color:#151515;text-shadow:0 4px 0 #fff,0 8px 22px rgba(42,193,188,.2)}.msg{font-weight:900;color:#444}.close{margin-top:18px;width:100%;border:0;border-radius:14px;padding:14px;background:#2ac1bc;color:#fff;font-size:17px;font-weight:1000;cursor:pointer}.confetti{position:fixed;top:-30px;z-index:10000;width:10px;height:18px;border-radius:3px;pointer-events:none;animation:fall var(--dur) linear forwards}.flash{position:fixed;inset:0;z-index:9998;pointer-events:none;background:#fff;opacity:0}.flash.go{animation:flash .48s ease}.crown{font-size:64px;line-height:1;animation:crown .7s cubic-bezier(.2,.9,.25,1.25)}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{0%{opacity:0;transform:translateY(28px) scale(.7) rotate(-2deg)}75%{transform:translateY(-5px) scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}@keyframes spark{from{transform:scale(.8) rotate(-10deg)}to{transform:scale(1.2) rotate(10deg)}}@keyframes crown{0%{transform:scale(.2) rotate(-25deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.95}}@keyframes flash{0%{opacity:0}18%{opacity:.75}100%{opacity:0}}</style></head><body><iframe id="game" src="two-stage.html" title="달타밥룰렛"></iframe><div id="flash" class="flash"></div><div id="win" aria-hidden="true"><div class="box"><div class="crown">👑</div><div class="title">🎉 오늘의 최종 메뉴 당첨 🎉</div><div id="cat" class="cat"></div><div id="food" class="food"></div><div class="msg">달타야 오늘은 이거다!</div><button id="close" class="close">좋아, 이걸로 간다 🍽️</button></div></div><script>const frame=document.getElementById('game'),win=document.getElementById('win'),cat=document.getElementById('cat'),food=document.getElementById('food'),closeBtn=document.getElementById('close'),flash=document.getElementById('flash');let timer=null,last='';function confetti(){const colors=['#2ac1bc','#ffd54a','#ff7b7b','#7fc8ff','#b99cff','#78d98b'];for(let i=0;i<110;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--dur',(2.2+Math.random()*1.9)+'s');c.style.setProperty('--drift',((Math.random()-.5)*300)+'px');c.style.animationDelay=(Math.random()*.35)+'s';c.style.width=(7+Math.random()*8)+'px';c.style.height=(10+Math.random()*14)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}}function celebrate(c,f){const key=c+'|'+f+'|'+Date.now();last=key;cat.textContent=c+'에서 뽑힌 메뉴';food.textContent=f;win.classList.add('show');win.setAttribute('aria-hidden','false');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');confetti();try{const d=frame.contentDocument,r=d.querySelector('.res'),w=d.querySelector('.wheel');if(r){r.style.transition='transform .2s,box-shadow .2s';r.style.transform='scale(1.045)';r.style.boxShadow='0 0 0 6px rgba(255,213,74,.28),0 16px 40px rgba(42,193,188,.3)';setTimeout(()=>{r.style.transform='';r.style.boxShadow=''},1700)}if(w){w.animate([{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:850,easing:'ease'})}}catch(e){}}function watch(){try{const d=frame.contentDocument,rc=d.getElementById('rc'),rf=d.getElementById('rf');if(!rc||!rf)return;const check=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(rc.textContent.startsWith('최종 당첨')){const c=rc.textContent.replace('최종 당첨 · ','').trim(),f=rf.textContent.trim();if(f)celebrate(c,f)}},35)};new MutationObserver(check).observe(rc,{childList:true,subtree:true,characterData:true});new MutationObserver(check).observe(rf,{childList:true,subtree:true,characterData:true})}catch(e){}}frame.addEventListener('load',watch);closeBtn.onclick=()=>{win.classList.remove('show');win.setAttribute('aria-hidden','true')};win.addEventListener('click',e=>{if(e.target===win)closeBtn.click()});</script></body></html>
