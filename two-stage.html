<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달타를 위한 배달음식 랜덤 뽑기</title><style>
:root{--m:#2ac1bc;--d:#159f9a;--b:#f6f7f8;--l:#e7eaed}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#222}header{position:sticky;top:0;z-index:9;text-align:center;background:#fff;border-bottom:1px solid var(--l);padding:13px;font-weight:900}main{max-width:980px;margin:auto;padding:18px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--m),#61d8d2);color:#fff;border-radius:25px;padding:24px 180px 24px 24px;margin-bottom:15px}.hero h1{margin:0 0 7px;font-size:clamp(25px,5vw,42px)}.hero p{margin:0}.hero img{position:absolute;width:180px;height:200px;right:-4px;bottom:-35px;object-fit:cover;object-position:50% 18%}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{background:#fff;border:1px solid var(--l);border-radius:21px;padding:17px;box-shadow:0 7px 23px #0000000b}.wheel{position:relative;aspect-ratio:1;max-width:560px;margin:auto}canvas{width:100%;height:100%;display:block}.ptr{position:absolute;z-index:4;left:50%;top:-2px;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #222}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:122px;height:122px;border-radius:50%;background:#fff;border:7px solid var(--m);display:grid;place-items:center;text-align:center;font-weight:900;padding:6px}.center img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 20%}button{border:0;cursor:pointer;font-weight:900}#spin{width:100%;padding:17px;border-radius:15px;background:var(--m);color:#fff;font-size:22px;margin-top:12px}#spin:disabled{opacity:.55}.res{margin-top:12px;text-align:center;background:#eafffe;border:2px solid #b8eeeb;border-radius:16px;padding:12px}.res img{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 20%}.res b{display:block;font-size:29px}h3{margin:2px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;background:#fafafa;border:1px solid var(--l);border-radius:13px;padding:12px;margin:8px 0;font-weight:800}.sw{width:48px;height:27px;position:relative}.sw input{display:none}.sw i{position:absolute;inset:0;background:#d7dce1;border-radius:30px}.sw i:before{content:"";position:absolute;width:21px;height:21px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--m)}.sw input:checked+i:before{transform:translateX(21px)}#cats{display:grid;grid-template-columns:1fr 1fr;gap:7px}#cats label{font-size:13px;border:1px solid var(--l);padding:8px;border-radius:10px}#cats input{accent-color:var(--m)}.actions{display:flex;gap:7px;margin-top:8px}.actions button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--l);background:#fff}#meta{font-size:12px;color:#777;margin-top:9px}#hist{display:flex;gap:6px;flex-wrap:wrap}#hist span{font-size:12px;background:#f1f4f5;border-radius:30px;padding:7px 9px}.mini{display:flex;align-items:center;gap:9px;margin-top:13px;background:#effffd;border:1px solid #c8f1ee;border-radius:14px;padding:9px;font-weight:800;font-size:13px}.mini img{width:45px;height:45px;border-radius:50%;object-fit:cover}
.stagebar{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px}
.step{padding:8px 11px;border-radius:999px;background:#eef2f3;color:#7a8588;font-size:13px;font-weight:900;border:1px solid var(--l)}
.step.active{background:var(--m);color:#fff;border-color:var(--m)}
.arrow{color:#aab2b5;font-weight:900}
#restart{width:100%;padding:11px;border-radius:12px;background:#fff;border:1px solid var(--l);color:#555;margin-top:8px;display:none}
.stageNote{text-align:center;font-size:13px;color:#687477;font-weight:800;margin:0 0 8px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-right:110px}.hero img{width:120px;height:145px}}</style></head><body>
<header>🍚 달타 전용 메뉴 선택기</header><main><section class="hero"><h1>달타를 위한 배달음식 랜덤 뽑기</h1><p>1차 카테고리 → 2차 해당 카테고리 메뉴. 두 번 돌려 오늘 메뉴를 딸깍.</p><img src="https://cdn.openart.ai/openart-uploads/production/2026-09/create-image/brkQkTCGkeUbnzKyd2Yd/fce9d369-dfed-41a1-81eb-470a7b276948_1789631429005_fe359f3b.png"></section>
<div class="grid"><section class="card"><div class="stagebar"><span id="s1" class="step active">1차 카테고리</span><span class="arrow">›</span><span id="s2" class="step">2차 메뉴</span></div><div id="stageNote" class="stageNote">먼저 음식 카테고리를 뽑아요.</div><div class="wheel"><div class="ptr"></div><canvas id="cv" width="700" height="700"></canvas><div class="center"><img src="https://cdn.openart.ai/openart-uploads/production/2026-09/create-image/brkQkTCGkeUbnzKyd2Yd/fce9d369-dfed-41a1-81eb-470a7b276948_1789631429005_fe359f3b.png"><small id="centerText">1차<br>카테고리</small></div></div><button id="spin">🎯 1차 카테고리 룰렛 돌리기</button><button id="restart">↩ 처음부터 다시 뽑기</button><div class="res"><img src="https://cdn.openart.ai/openart-uploads/production/2026-09/create-image/brkQkTCGkeUbnzKyd2Yd/fce9d369-dfed-41a1-81eb-470a7b276948_1789631429005_fe359f3b.png"><small id="rc">1차 준비</small><b id="rf">카테고리를 먼저 뽑아주세요</b></div></section>
<aside class="card"><h3>빠른 조건</h3><div id="opts"></div><h3 style="margin-top:17px">카테고리</h3><div id="cats"></div><div class="actions"><button id="on">전체 선택</button><button id="off">전체 해제</button></div><div id="meta"></div><h3 style="margin-top:17px">최근 결과</h3><div id="hist">아직 없음</div><div class="mini"><img src="https://cdn.openart.ai/openart-uploads/production/2026-09/create-image/brkQkTCGkeUbnzKyd2Yd/fce9d369-dfed-41a1-81eb-470a7b276948_1789631429005_fe359f3b.png"><span>달타야 오늘은 룰렛이 골라주는 걸 먹자 🎯</span></div></aside></div></main>
<script>
const FULL_MENU={
"김밥":["야채김밥","참치김밥","치즈김밥","돈까스김밥","제육김밥","불고기김밥","멸치김밥","매운어묵김밥","계란김밥","묵은지김밥","새우김밥","유부김밥"],
"돈까스":["등심돈까스","안심돈까스","치즈돈까스","고구마치즈돈까스","왕돈까스","경양식돈까스","일식돈까스","매운돈까스","카레돈까스","돈까스덮밥"],
"냉면":["물냉면","비빔냉면","회냉면","코다리냉면","물비빔냉면","평양냉면","함흥냉면"],
"떡볶이":["국물떡볶이","쌀떡볶이","밀떡볶이","로제떡볶이","짜장떡볶이","치즈떡볶이","즉석떡볶이","기름떡볶이","라볶이"],
"김치찜":["돼지고기김치찜","삼겹살김치찜","목살김치찜","등갈비김치찜","참치김치찜","꽁치김치찜","묵은지김치찜"],
"초밥":["모둠초밥","연어초밥","광어초밥","참치초밥","새우초밥","장어초밥","소고기초밥","계란초밥","유부초밥","구운연어초밥"],
"제육볶음":["기본제육볶음","고추장제육볶음","간장제육볶음","김치제육볶음","불향제육볶음","제육덮밥","제육쌈밥"],
"오리":["오리주물럭","오리불고기","훈제오리","오리로스","오리구이","간장오리불고기","매운오리주물럭"],
"족발":["기본족발","앞다리족발","뒷다리족발","불족발","마늘족발","냉채족발","반반족발"],
"보쌈":["기본보쌈","삼겹보쌈","목살보쌈","마늘보쌈","굴보쌈","김치보쌈","보쌈정식"],
"햄버거":["불고기버거","치즈버거","더블치즈버거","치킨버거","새우버거","베이컨버거","통새우버거","핫치킨버거","에그버거","수제버거"],
"샌드위치":["에그샌드위치","햄치즈샌드위치","클럽샌드위치","치킨샌드위치","참치샌드위치","BLT샌드위치","불고기샌드위치","새우샌드위치","베이컨에그샌드위치","파니니"]
};
const kstDay=()=>new Date(Date.now()+9*60*60*1000).toISOString().slice(0,10);
const isSingleMenuDay=()=>kstDay()==="2026-10-11";
const SPECIAL_CAT="파스타",SPECIAL_FOOD="쉬림프 알리 올리오";
const SINGLE_MENU={ [SPECIAL_CAT]:[SPECIAL_FOOD] };
const HIDDEN_MARK="❓ HIDDEN"; // The actual dish remains concealed until the secret prize lands.
// Preserve the original full-menu odds even when a visitor leaves only one category enabled.
const HIDDEN_ODDS=1/(Object.values(FULL_MENU).reduce((total,menus)=>total+menus.length,0)+1);
let F=isSingleMenuDay()?SINGLE_MENU:FULL_MENU,C=Object.keys(F);
const sp=["매운","불족발","고추장","주물럭","떡볶이","라볶이"],sn=[],mx=[]
const $=x=>document.getElementById(x),cv=$("cv"),x=cv.getContext("2d");
let shown=[],ang=0,busy=0,H=[],stage=isSingleMenuDay()?2:1,chosenCat=isSingleMenuDay()?SPECIAL_CAT:null,pendingWinner=null;
$("opts").innerHTML=[["ns","🍺 술안주 제외"],["np","🌶️ 매운 음식 제외"],["one","👤 1인분 메뉴만"],["snd","🔊 룰렛 효과음"]].map((a,i)=>`<div class=row><span>${a[1]}</span><label class=sw><input id=${a[0]} type=checkbox ${i==3?"checked":""}><i></i></label></div>`).join("");
$("cats").innerHTML=C.map(c=>`<label><input type=checkbox checked value="${c}"> ${c}</label>`).join("");
function syncSingleMenuLayout(){
  const on=isSingleMenuDay();
  document.querySelector("aside.card").style.display=on?"none":"";
  document.querySelector(".grid").style.gridTemplateColumns=on?"minmax(0,1fr)":"";
  document.querySelector(".stagebar").style.display=on?"none":"";
}
syncSingleMenuLayout();

const has=(n,a)=>a.some(t=>n.includes(t));
function filteredMenus(cat){
  let r=[];
  for(let n of F[cat]||[]){
    if($("ns").checked&&(cat.includes("야식")||has(n,sn)))continue;
    if($("np").checked&&has(n,sp))continue;
    if($("one").checked&&has(n,mx))continue;
    r.push(n);
  }
  return r;
}
function enabledCats(){
  const en=new Set([...document.querySelectorAll("#cats input:checked")].map(e=>e.value));
  return C.filter(c=>en.has(c)&&filteredMenus(c).length);
}
function allFilteredCount(){return enabledCats().reduce((s,c)=>s+filteredMenus(c).length,0)}

function draw(items){
  x.clearRect(0,0,700,700);
  if(!items.length){
    x.fillStyle="#eef1f2";x.beginPath();x.arc(350,350,320,0,Math.PI*2);x.fill();
    x.fillStyle="#777";x.font="900 25px sans-serif";x.textAlign="center";x.fillText("조건에 맞는 후보가 없어요",350,360);return;
  }
  let N=items.length,col=["#2ac1bc","#60d7d2","#ffd166","#ff9f6e","#a8dadc","#81c784","#90caf9","#f6bd60","#84a59d","#f28482","#b8c0ff","#cdb4db"];
  let fs=N<=16?22:N<=24?17:N<=36?13:10;
  let maxChars=N<=18?8:N<=30?6:5;
  if(N===1){
    x.beginPath();x.arc(350,350,320,0,Math.PI*2);x.fillStyle=col[0];x.fill();
    x.fillStyle="#173636";x.font="900 30px sans-serif";x.textAlign="center";
    x.fillText(items[0],350,252,540);
    return;
  }
  for(let i=0;i<N;i++){
    let s=-Math.PI/2+i*2*Math.PI/N,e=-Math.PI/2+(i+1)*2*Math.PI/N;
    x.beginPath();x.moveTo(350,350);x.arc(350,350,320,s,e);x.closePath();x.fillStyle=col[i%col.length];x.fill();
    x.strokeStyle="#fff";x.lineWidth=N>30?2:4;x.stroke();
    x.save();x.translate(350,350);x.rotate((s+e)/2);x.textAlign="right";x.fillStyle="#202626";x.font=`900 ${fs}px sans-serif`;
    let t=items[i];x.fillText(t.length>maxChars?t.slice(0,maxChars)+"…":t,292,fs*.3);x.restore();
  }
}
function setStageUI(){
  $("s1").classList.toggle("active",stage===1);$("s2").classList.toggle("active",stage===2);
  if(stage===1){
    $("centerText").innerHTML="1차<br>카테고리";
    $("stageNote").textContent="모든 일반 최종 메뉴가 같은 확률로 뽑혀요.";
    $("spin").textContent="🎯 1차 카테고리 룰렛 돌리기";
    $("restart").style.display="none";
    shown=enabledCats();draw(shown);
    $("meta").textContent=`1차 카테고리 ${shown.length}개 · 대표 메뉴 ${allFilteredCount()}개 · 모든 일반 메뉴 동일 확률`;
  }else{
    $("centerText").innerHTML="2차<br>메뉴";
    let menus=filteredMenus(chosenCat);
    $("stageNote").textContent=`${chosenCat} 당첨! 대표 메뉴 ${menus.length}개 중 최종 하나를 뽑아요.`;
    $("spin").textContent=`🍽️ 2차 ${chosenCat} 메뉴 룰렛 돌리기`;
    $("restart").style.display="block";
    shown=[...menus].sort(()=>Math.random()-.5).slice(0,Math.min(14,menus.length));draw(shown);
    $("meta").textContent=`선택된 카테고리: ${chosenCat} · 실제 추첨 후보 ${menus.length}개 · 룰렛 표시 최대 14개`;
  }
  if(isSingleMenuDay()){
    $("stageNote").textContent="오늘(10월 11일) 한정! 쉬림프 알리 올리오 하나만 나와요.";
    $("spin").textContent="🍽️ 쉬림프 알리 올리오 룰렛 돌리기";
    $("restart").style.display="none";
  }
}
function resetToStage1(clearResult=false){
  if(busy)return;
  stage=isSingleMenuDay()?2:1;chosenCat=isSingleMenuDay()?SPECIAL_CAT:null;pendingWinner=null;ang=0;
  if(clearResult){$("rc").textContent=isSingleMenuDay()?"오늘의 한정 메뉴":"1차 준비";$("rf").textContent=isSingleMenuDay()?SPECIAL_FOOD:"카테고리를 먼저 뽑아주세요";}
  setStageUI();
}
document.querySelectorAll("#cats input,#ns,#np,#one").forEach(e=>e.addEventListener("change",()=>resetToStage1(true)));
$("snd").addEventListener("change",()=>{});
$("on").onclick=()=>{document.querySelectorAll("#cats input").forEach(e=>e.checked=1);resetToStage1(true)};
$("off").onclick=()=>{document.querySelectorAll("#cats input").forEach(e=>e.checked=0);resetToStage1(true)};
$("restart").onclick=()=>resetToStage1(true);

let ac;
function tone(f,d=.03,v=.03,t="square",delay=0){
  if(!$("snd").checked)return;
  ac??=new(window.AudioContext||window.webkitAudioContext);
  if(ac.state=="suspended")ac.resume();
  let o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
  o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)
}
function win(){tone(660,.09,.05,"sine");tone(880,.1,.05,"sine",.1);tone(1100,.15,.05,"sine",.21)}
function stageWin(){tone(520,.07,.04,"triangle");tone(720,.11,.045,"triangle",.08)}

function spinWheel(items,onDone,forcedWinner=null){
  if(busy||!items.length)return;
  busy=1;$("spin").disabled=1;$("restart").disabled=1;
  shown=items;draw(shown);
  let idx=forcedWinner!==null?items.indexOf(forcedWinner):Math.floor(Math.random()*items.length),winner=items[idx],N=items.length,sl=2*Math.PI/N;
  let st=ang,target=-(idx*sl+sl/2),turns=5+Math.floor(Math.random()*3);
  let en=ang+Math.PI*2*turns+target-(ang%(Math.PI*2)),t0=performance.now(),lt=-1;
  function f(now){
    let t=Math.min(1,(now-t0)/4200),ease=1-Math.pow(1-t,4);ang=st+(en-st)*ease;
    let q=Math.floor(Math.abs(ang-st)/sl);if(q!==lt){lt=q;tone(500+260*(1-t),.022,.025)}
    x.save();x.translate(350,350);x.rotate(ang);x.translate(-350,-350);draw(shown);
    let im=x.getImageData(0,0,700,700);x.restore();x.putImageData(im,0,0);
    if(t<1)requestAnimationFrame(f);else{busy=0;$("spin").disabled=0;$("restart").disabled=0;onDone(winner)}
  }
  requestAnimationFrame(f)
}

$("spin").onclick=()=>{
  if(busy)return;
  if(stage===1){
    let cats=enabledCats();
    if(!cats.length)return alert("조건에 맞는 카테고리가 없어요. 필터를 조금 풀어주세요.");
    const allPairs=[];
    for(const c of cats) for(const n of filteredMenus(c)) allPairs.push({c,n});
    // The secret rolls independently with fixed odds, unaffected by filters or category count.
    const isHiddenPick=!isSingleMenuDay()&&Math.random()<HIDDEN_ODDS;
    const picked=allPairs[Math.floor(Math.random()*allPairs.length)];
    chosenCat=picked.c; pendingWinner=isHiddenPick?SPECIAL_FOOD:picked.n;
    spinWheel(cats,w=>{
      $("rc").textContent="1차 카테고리 당첨";$("rf").textContent=w;stageWin();
      setTimeout(()=>{stage=2;ang=0;setStageUI()},650);
    },chosenCat);
  }else{
    let menus=filteredMenus(chosenCat);
    if(!menus.length){resetToStage1(true);return alert("이 카테고리에 조건에 맞는 메뉴가 없어요.");}
    // Re-draws within a category also keep a small chance of the hidden result.
    const isHiddenPick=!isSingleMenuDay()&&(pendingWinner===SPECIAL_FOOD||(pendingWinner===null&&Math.random()<HIDDEN_ODDS));
    const finalWinner=isHiddenPick?SPECIAL_FOOD:(pendingWinner&&menus.includes(pendingWinner)?pendingWinner:menus[Math.floor(Math.random()*menus.length)]);
    pendingWinner=null;
    const wheelWinner=isHiddenPick?HIDDEN_MARK:finalWinner;
    let visualPool=isHiddenPick
      ?[HIDDEN_MARK,...menus.sort(()=>Math.random()-.5).slice(0,13)].sort(()=>Math.random()-.5)
      :[finalWinner,...menus.filter(n=>n!==finalWinner).sort(()=>Math.random()-.5).slice(0,Math.min(13,menus.length-1))].sort(()=>Math.random()-.5);
    spinWheel(visualPool,w=>{
      const result=isHiddenPick?SPECIAL_FOOD:w;
      $("rc").textContent=isHiddenPick?"최종 당첨 · 히든":`최종 당첨 · ${chosenCat}`;
      $("rf").textContent=result;
      H.unshift(`${isHiddenPick?"🎁 히든":chosenCat} · ${result}`);H=H.slice(0,8);$("hist").innerHTML=H.map(n=>`<span>${n}</span>`).join("");
      win();$("spin").textContent=isSingleMenuDay()?"🍽️ 다시 돌리기":"🎲 같은 카테고리에서 다시 뽑기";$("restart").style.display=isSingleMenuDay()?"none":"block";
    },wheelWinner);
  }
};
setStageUI();
if(isSingleMenuDay()){$("rc").textContent="오늘의 한정 메뉴";$("rf").textContent=SPECIAL_FOOD;}
let previousSingleMenuDay=isSingleMenuDay();
setInterval(()=>{
  const next=isSingleMenuDay();
  if(next===previousSingleMenuDay||busy)return;
  previousSingleMenuDay=next;
  F=next?SINGLE_MENU:FULL_MENU;C=Object.keys(F);
  $("cats").innerHTML=C.map(c=>`<label><input type=checkbox checked value="${c}"> ${c}</label>`).join("");
  document.querySelectorAll("#cats input").forEach(e=>e.addEventListener("change",()=>resetToStage1(true)));
  syncSingleMenuLayout();
  H=[];$("hist").textContent="아직 없음";
  resetToStage1(true);
},10000);
</script></body></html>
