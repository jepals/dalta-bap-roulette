<title>꿀떡 먹은 달타</title>
<style>
:root{--gold:#f0b73e;--cream:#fff8e9;--brown:#4f372a;--pink:#ffe3df;--mint:#e8fff7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 0,#fffdf7 0,#fff1d5 45%,#ffe7c7 100%);color:#3d2e28}
body{min-height:100svh;overflow-x:hidden}.app{width:min(920px,100%);margin:auto;padding:18px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{font-weight:1000;font-size:clamp(24px,6vw,42px);letter-spacing:-.05em}.brand b{color:#d99013}.mute{border:0;border-radius:999px;padding:10px 13px;background:#fff8;box-shadow:0 4px 16px #7e561522;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat{background:#fff9;border:1px solid #f2d79c;border-radius:16px;padding:9px;text-align:center;box-shadow:0 7px 20px #8b5b1520}.stat small{display:block;color:#9a7a50;font-weight:800;font-size:11px}.stat strong{font-size:18px}
.panel{background:#fffaf1e8;border:2px solid #f0d18f;border-radius:26px;box-shadow:0 18px 55px #8a551a24;padding:18px;backdrop-filter:blur(6px)}
.hero{text-align:center;padding:28px 14px}.hero h1{font-size:clamp(38px,10vw,72px);margin:0 0 8px;line-height:.98;letter-spacing:-.07em}.hero p{font-weight:800;color:#755a46;line-height:1.6}.btn{border:0;border-radius:18px;padding:15px 22px;font-size:18px;font-weight:1000;background:linear-gradient(135deg,#f7c94b,#efa32b);color:#4a3100;box-shadow:0 10px 0 #cf851d,0 18px 30px #a16b253b;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 7px 0 #cf851d}
.status{text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,28px);font-weight:1000;margin:6px 0}.status.pop{animation:pop .45s ease}.timer{height:9px;background:#f3e0bf;border-radius:999px;overflow:hidden;margin:0 auto 12px;max-width:720px}.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#efb633,#f47d58);transition:width .1s linear}
.board{position:relative;margin:0 auto;width:100%;max-width:820px;min-height:260px;touch-action:manipulation}.card{position:absolute;left:0;top:0;border:0;background:transparent;padding:0;transition:transform .42s cubic-bezier(.2,.8,.2,1);will-change:transform;cursor:pointer}.card[disabled]{cursor:default}.card .frame{position:relative;width:100%;height:100%;overflow:hidden;border-radius:22px;border:3px solid #ebc975;background:#f9eee9;box-shadow:0 10px 20px #70471c28;transition:.2s}.card img{width:100%;height:100%;display:block;object-fit:cover}.card.target .frame{box-shadow:0 0 0 7px #ffd96088,0 13px 30px #cb8e3c55;animation:pulse .55s ease-in-out infinite alternate}.card.good .frame{box-shadow:0 0 0 7px #7de2a3,0 0 42px #5ecf8d99;transform:scale(1.06)}.card.bad .frame{box-shadow:0 0 0 7px #ff8b88,0 0 42px #ff827a77;animation:shake .35s ease}.num{position:absolute;left:8px;top:8px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#4b3426dd;color:#fff;font-weight:1000;font-size:13px}.rice{position:absolute;right:7px;top:8px;font-size:26px;filter:drop-shadow(0 3px 3px #0003);opacity:0;transform:scale(.4);transition:.2s}.card.target .rice{opacity:1;transform:scale(1);animation:bounce .5s ease infinite alternate}
.tip{text-align:center;margin:16px 0 0;color:#8b6e55;font-size:13px;font-weight:800}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#2f241cb8;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.overlay.show{display:flex}.overbox{width:min(460px,100%);background:#fffaf0;border:4px solid #f0c55e;border-radius:28px;padding:26px;text-align:center;box-shadow:0 30px 90px #0007;animation:pop .55s cubic-bezier(.2,.9,.2,1.25)}.overbox h2{font-size:38px;margin:0 0 8px}.overbox p{font-weight:900;color:#73583f;line-height:1.6}
@keyframes pop{0%{transform:scale(.78);opacity:0}100%{transform:none;opacity:1}}@keyframes pulse{to{transform:scale(1.04)}}@keyframes bounce{to{transform:translateY(-5px) scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-5px)}} 
@media(max-width:520px){.app{padding:12px 10px 28px}.stats{gap:5px}.stat{padding:7px 3px}.panel{padding:12px;border-radius:22px}.status{min-height:52px}.card .frame{border-radius:18px}}

function sfx(kind){if(kind==='eat'){tone(720,90);setTimeout(()=>tone(920,120),80)}if(kind==='swap')tone(210,55,'triangle');if(kind==='ok'){tone(660,100);setTimeout(()=>tone(880,140),90);setTimeout(()=>tone(1100,180),190)}if(kind==='no'){tone(170,220,'sawtooth')}}
function updateStats(){roundEl.textContent=round;scoreEl.textContent=score;comboEl.textContent=combo;lifeEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function countForRound(){return round<4?3:round<7?4:5}
function dims(n){const w=board.clientWidth;let cols=n;if(w<560&&n>3)cols= n===4?2:3;const gap=w<560?10:18;const cw=Math.min(155,Math.floor((w-gap*(cols-1))/cols));const ch=Math.floor(cw*1.22);const rows=Math.ceil(n/cols);const total=cols*cw+(cols-1)*gap;const ox=Math.max(0,(w-total)/2);return{cols,gap,cw,ch,rows,ox}}
function slotXY(slot,n){const d=dims(n),r=Math.floor(slot/d.cols),c=slot%d.cols;return{x:d.ox+c*(d.cw+d.gap),y:r*(d.ch+d.gap),...d}}
function place(animate){const n=cards.length,d=dims(n);board.style.height=(d.rows*d.ch+(d.rows-1)*d.gap)+'px';cards.forEach((card,id)=>{const slot=slotToCard.indexOf(id),p=slotXY(slot,n);card.style.width=p.cw+'px';card.style.height=p.ch+'px';if(!animate)card.style.transition='none';card.style.transform='translate('+p.x+'px,'+p.y+'px)';if(!animate){requestAnimationFrame(()=>card.style.transition='')}})}
function buildCards(n){board.innerHTML='';cards=[];slotToCard=[];for(let i=0;i<n;i++){slotToCard.push(i);const b=document.createElement('button');b.className='card';b.disabled=true;b.dataset.id=i;b.innerHTML='<div class="frame"><img alt="한복 달타"><span class="num">'+(i+1)+'</span><span class="rice">🍡</span></div>';b.querySelector('img').src=WAIT;b.onclick=()=>pick(i,b);board.appendChild(b);cards.push(b)}place(false)}
function setStatus(t){statusEl.textContent=t;statusEl.classList.remove('pop');void statusEl.offsetWidth;statusEl.classList.add('pop')}
async function beginRound(){clearInterval(timerId);canPick=false;bar.style.width='100%';updateStats();const n=countForRound();buildCards(n);target=Math.floor(Math.random()*n);setStatus('잘 봐! 누가 꿀떡을 먹을까? 👀');await sleep(650);cards[target].classList.add('target');cards[target].querySelector('img').src=EAT;setStatus('이 달타가 꿀떡을 먹었어요! 🍯');sfx('eat');await sleep(Math.max(900,1450-round*45));cards[target].classList.remove('target');cards[target].querySelector('img').src=WAIT;setStatus('집중! 달타들이 섞입니다 ✨');await sleep(350);await shuffle();setStatus('꿀떡 먹은 달타는 누구?');enablePick();startTimer()}
async function shuffle(){const n=cards.length,steps=Math.min(18,6+round*2),speed=Math.max(210,520-round*28);cards.forEach(c=>c.style.transition='transform '+speed+'ms cubic-bezier(.2,.8,.2,1)');for(let k=0;k<steps;k++){let a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*n);while(b===a)b=Math.floor(Math.random()*n);[slotToCard[a],slotToCard[b]]=[slotToCard[b],slotToCard[a]];place(true);sfx('swap');await sleep(speed+45)}}
function enablePick(){canPick=true;cards.forEach(c=>c.disabled=false)}
function disablePick(){canPick=false;cards.forEach(c=>c.disabled=true)}
function startTimer(){const total=Math.max(4500,8200-round*260),start=performance.now();timerId=setInterval(()=>{const left=Math.max(0,1-(performance.now()-start)/total);bar.style.width=(left*100)+'%';if(left<=0){clearInterval(timerId);timeout()}},90)}
async function pick(id,card){if(!canPick)return;disablePick();clearInterval(timerId);if(id===target){card.classList.add('good');card.querySelector('img').src=EAT;combo++;score+=100+combo*25;updateStats();setStatus(combo>=3?'정답! '+combo+' COMBO 🔥':'정답! 역시 달타잘알! 🎉');sfx('ok');await sleep(950);round++;beginRound()}else{card.classList.add('bad');cards[target].classList.add('good');cards[target].querySelector('img').src=EAT;lives--;combo=0;updateStats();setStatus('땡! 꿀떡은 저 달타가 먹었어 😵');sfx('no');await sleep(1200);if(lives<=0)gameOver();else beginRound()}}
async function timeout(){if(!canPick)return;disablePick();cards[target].classList.add('good');cards[target].querySelector('img').src=EAT;lives--;combo=0;updateStats();setStatus('시간 초과! 꿀떡 달타를 놓쳤어 ⏰');sfx('no');await sleep(1200);if(lives<=0)gameOver();else beginRound()}
function gameOver(){const best=Math.max(score,Number(localStorage.getItem('kkultteokDaltaBest')||0));localStorage.setItem('kkultteokDaltaBest',best);document.getElementById('summary').innerHTML='최종 점수 <b>'+score+'</b>점<br>도달 라운드 <b>'+round+'</b><br>최고 기록 <b>'+best+'</b>점';document.getElementById('over').classList.add('show')}
function startGame(){round=1;score=0;combo=0;lives=3;hero.classList.add('hidden');play.classList.remove('hidden');stats.classList.remove('hidden');updateStats();beginRound()}
document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=()=>{document.getElementById('over').classList.remove('show');startGame()};
document.getElementById('mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇 소리 OFF':'🔊 소리 ON'};
addEventListener('resize',()=>{if(cards.length)place(false)});
</script>
</body>
