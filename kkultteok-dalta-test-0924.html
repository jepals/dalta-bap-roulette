<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">\n<meta name="color-scheme" content="light">
<title>꿀떡 먹은 달타 - 검증판 v5</title>
<style>
:root{color-scheme:only light;--ink:#493426;--gold:#efa928;--cream:#fff8e9;--red:#ef6c63;--green:#5ac58a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fdebd1;color:var(--ink);overflow-x:hidden}
button{font:inherit}
.wrap{width:min(1000px,100%);margin:auto;padding:10px 10px 24px}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.logo{font-size:clamp(21px,5vw,38px);font-weight:1000;letter-spacing:-.055em;text-shadow:0 2px 0 #fff}.logo b{color:#d98b05}
.sound{border:2px solid #e6bd69;background:#fff9df;border-radius:999px;padding:8px 12px;font-weight:1000;color:#725328}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.hud>div{border:2px solid #e9c57a;border-radius:14px;background:#fff8dfd9;padding:6px;text-align:center;box-shadow:0 4px 0 #d9a847}
.hud small{display:block;font-size:10px;font-weight:900;color:#9b794d}.hud strong{font-size:17px}
.stage{position:relative;width:100%;height:min(71svh,650px);min-height:460px;overflow:hidden;border:4px solid #d9a94c;border-radius:25px;background:linear-gradient(#ffe6d9 0 45%,#f8d89a 45% 46%,#9ec86e 46% 100%);box-shadow:0 15px 45px #8a5b2a48,inset 0 0 0 3px #fff7;isolation:isolate}
.sky{position:absolute;inset:0 0 45% 0;background:radial-gradient(circle at 16% 15%,#fff9 0 6%,transparent 6.5%),radial-gradient(circle at 75% 17%,#fff8 0 8%,transparent 8.5%),linear-gradient(#ffe8e3,#fff2d7)}
.hill{position:absolute;width:70%;height:36%;border-radius:50% 50% 0 0;background:#bfdc88;bottom:25%;filter:drop-shadow(0 -3px 0 #fff5)}.h1{left:-28%;transform:rotate(7deg)}.h2{right:-25%;background:#a8cf7f;transform:rotate(-8deg)}
.ground{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#8fc562,#73ad4f);border-top:5px solid #fff5}
.ground:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff7 0 2px,transparent 2.5px) 0 0/36px 36px;opacity:.45}
.flower{position:absolute;font-size:clamp(20px,3vw,36px);opacity:.75;filter:drop-shadow(0 2px 2px #0001);z-index:1}
.f1{left:5%;bottom:21%}.f2{right:5%;bottom:18%}.f3{left:48%;bottom:22%}.f4{right:20%;bottom:28%}
.status{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;width:min(88%,680px);text-align:center;font-size:clamp(18px,4vw,30px);font-weight:1000;color:#65411e;background:#fff9d9e8;border:3px solid #e6b857;border-radius:999px;padding:9px 14px;box-shadow:0 6px 0 #c98d2c,0 10px 25px #6e451b25}
.status.bump{animation:statusBump .35s ease}
.progress{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:19;width:min(72%,520px);height:8px;border-radius:99px;background:#7c5c3633;overflow:hidden}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f1b22e,#f17160)}
.actor{position:absolute;left:0;top:0;width:100px;border:0;background:none;padding:0;z-index:10;transform-origin:50% 100%;touch-action:manipulation;cursor:pointer;filter:drop-shadow(0 8px 6px #55341342)}
.actor img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}.actor:disabled{cursor:default}.actor.idle{animation:idleBob 1.35s ease-in-out infinite alternate}.actor.peek{filter:drop-shadow(0 0 7px #ffd74d) drop-shadow(0 0 18px #ffc44d)}
.actor.happy{animation:happy .42s ease 3}.actor.wrong{animation:wrong .35s ease 3;filter:drop-shadow(0 0 11px #ff544a)}
.actor.correct{animation:happy .42s ease 3;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 24px #ffd34f)}
.shadow{position:absolute;z-index:4;width:70px;height:17px;background:#35511e33;border-radius:50%;filter:blur(2px);transform:translate(-50%,-50%)}
.tteok{position:absolute;z-index:30;width:48px;height:42px;border-radius:47% 47% 43% 43%;background:linear-gradient(#fffdf4 0 63%,#e8a827 64%);border:3px solid #ac7421;box-shadow:0 5px 0 #7f561c33;display:none;transform-origin:center}
.tteok:after{content:"";position:absolute;width:9px;height:13px;right:6px;bottom:-8px;border-radius:0 0 8px 8px;background:#e8a827}
.bubble{position:absolute;z-index:31;padding:5px 10px;border:2px solid #b77d25;background:white;border-radius:16px;font-weight:1000;color:#714d20;opacity:0;pointer-events:none}
.spark{position:absolute;z-index:35;font-size:30px;pointer-events:none;animation:spark .7s ease forwards}
.mascot{position:absolute;z-index:16;right:10px;bottom:9px;width:clamp(58px,9vw,92px);filter:drop-shadow(0 6px 4px #57331f33);animation:mascotBob 1.2s ease-in-out infinite alternate}
.mascotTalk{position:absolute;z-index:17;right:82px;bottom:72px;background:#fff;border:2px solid #c6943d;border-radius:17px 17px 4px 17px;padding:7px 10px;font-size:12px;font-weight:900;max-width:180px;box-shadow:0 4px 10px #0001;opacity:0;transition:.2s}.mascotTalk.on{opacity:1}
.start,.gameover{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff5d6db,#ffe4becf);backdrop-filter:blur(4px);padding:16px}
.startCard,.overCard{width:min(500px,94%);text-align:center;background:#fffaf0;border:4px solid #dca941;border-radius:27px;padding:19px 18px 21px;box-shadow:0 15px 0 #bd7d25,0 25px 60px #61431e55;animation:pop .55s cubic-bezier(.2,.9,.22,1.25)}
.title{font-size:clamp(40px,10vw,68px);font-weight:1000;line-height:.96;letter-spacing:-.07em;margin:0}.title b{color:#df8f05}
.startHero{height:190px;display:flex;justify-content:center;align-items:flex-end;margin:7px 0}.startHero img{height:100%;filter:drop-shadow(0 8px 5px #79542f33)}
.desc{font-weight:900;line-height:1.55;color:#77583e;margin:8px 0 15px}
.btn{border:0;border-radius:17px;background:linear-gradient(#ffd75f,#e9a72b);color:#5b3a08;padding:13px 22px;font-size:18px;font-weight:1000;box-shadow:0 7px 0 #bd7a20;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 4px 0 #bd7a20}
.gameover{display:none}.gameover.on{display:flex}.overCard h2{font-size:40px;margin:0}.result{font-size:18px;font-weight:900;line-height:1.7;color:#765636}
.flash{position:absolute;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .45s ease}
.hint{position:absolute;left:12px;bottom:9px;z-index:14;font-size:11px;font-weight:900;color:#fff;background:#4b342799;border-radius:999px;padding:6px 9px}
@keyframes idleBob{to{transform:translateY(-4px)}}@keyframes mascotBob{to{transform:translateY(-7px) rotate(3deg)}}@keyframes statusBump{50%{transform:translateX(-50%) scale(1.06)}}@keyframes happy{50%{transform:translateY(-14px) scale(1.06)}}@keyframes wrong{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}@keyframes pop{from{opacity:0;transform:scale(.78) translateY(20px)}to{opacity:1;transform:none}}@keyframes spark{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-35px) scale(.8)}}@keyframes flash{15%{opacity:.65}100%{opacity:0}}
@media(max-width:560px){.wrap{padding:6px 6px 14px}.stage{height:73svh;min-height:500px;border-radius:18px}.hud{gap:4px}.hud>div{padding:5px 2px;border-radius:11px}.status{top:9px}.progress{top:68px}.mascotTalk{right:66px;bottom:65px}.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="logo">🍯 <b>꿀떡</b> 먹은 달타</div><button id="sound" class="sound">🔊 ON</button></div>
<div class="hud"><div><small>ROUND</small><strong id="round">1</strong></div><div><small>SCORE</small><strong id="score">0</strong></div><div><small>COMBO</small><strong id="combo">0</strong></div><div><small>LIFE</small><strong id="life">♥♥♥</strong></div></div>
<div id="stage" class="stage">
<div class="sky"></div><div class="hill h1"></div><div class="hill h2"></div><div class="ground"></div>
<div class="flower f1">🌼</div><div class="flower f2">🌼</div><div class="flower f3">🌸</div><div class="flower f4">🌼</div>
<div id="status" class="status">준비!</div><div class="progress"><i id="bar"></i></div>
<div id="tteok" class="tteok"></div><div id="bubble" class="bubble">냠!</div>
<img class="mascot" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JhwBap0IpZBN9h7incqvdGpu6F/332ef4f4-3a6a-462b-ba28-127c97bde53e.png" alt="꿀즙이"><div id="mascotTalk" class="mascotTalk">달타를 잘 봐!</div>
<div class="hint">달타 자체를 클릭하세요</div><div id="flash" class="flash"></div>
<div id="start" class="start"><div class="startCard"><div class="title"><b>꿀떡</b> 먹은<br>달타 찾기</div><div class="startHero"><img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JhwBap0IpZBN9h7incqvdGpu6F/c729b54f-725c-4674-94a3-d0350b42bada.png" alt="한복 달타"></div><div class="desc">꿀떡을 먹은 달타를 기억하세요.<br>달타들이 뛰어다닌 뒤, 그 달타를 직접 클릭!</div><button id="startBtn" class="btn">게임 시작 🍯</button></div></div>
<div id="over" class="gameover"><div class="overCard"><h2>게임 오버!</h2><div id="result" class="result"></div><button id="again" class="btn">다시 도전 🍯</button></div></div>
</div></div>
<script>
const IMG='https://d2ol7oe51mr4n9.cloudfront.net/user_3JhwBap0IpZBN9h7incqvdGpu6F/c729b54f-725c-4674-94a3-d0350b42bada.png',stage=document.getElementById('stage'),statusEl=document.getElementById('status'),bar=document.getElementById('bar'),tteok=document.getElementById('tteok'),bubble=document.getElementById('bubble'),talk=document.getElementById('mascotTalk');
let round=1,score=0,combo=0,lives=3,target=0,actors=[],slotFor=[],canPick=false,timer=null,muted=false,audio=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function count(){return round<4?3:round<7?4:5}
function update(){document.getElementById('round').textContent=round;document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo;document.getElementById('life').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function say(t){statusEl.textContent=t;statusEl.classList.remove('bump');void statusEl.offsetWidth;statusEl.classList.add('bump')}
function mTalk(t,ms){talk.textContent=t;talk.classList.add('on');setTimeout(()=>talk.classList.remove('on'),ms||900)}
function tone(f,d,type){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.09,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d/1000);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d/1000+.02)}catch(e){}}
function sfx(k){if(k==='eat'){tone(620,90);setTimeout(()=>tone(880,120),80)}if(k==='move')tone(240,55,'triangle');if(k==='ok'){tone(650,90);setTimeout(()=>tone(880,110),90);setTimeout(()=>tone(1080,160),185)}if(k==='bad')tone(160,250,'sawtooth')}
function metrics(){let w=stage.clientWidth,h=stage.clientHeight,n=actors.length||count();let aw=Math.max(54,Math.min(125,(w-22)/n*.73));if(innerWidth<500)aw=Math.max(50,Math.min(77,(w-12)/n*.88));let ah=aw*1.995,ground=h*.28,baseY=h-ground-ah+12;let xs=[];for(let i=0;i<n;i++)xs.push((i+.5)*w/n-aw/2);return{w,h,aw,ah,baseY,xs}}
function posForSlot(slot){let m=metrics();return{x:m.xs[slot],y:m.baseY,w:m.aw,h:m.ah}}
function makeActors(){actors.forEach(a=>a.remove());actors=[];slotFor=[];let n=count();for(let i=0;i<n;i++){let b=document.createElement('button');b.className='actor idle';b.dataset.id=i;b.disabled=true;b.innerHTML='<img src="'+IMG+'" alt="달타">';b.onclick=()=>pick(i,b);stage.appendChild(b);actors.push(b);slotFor[i]=i}placeAll(false)}
function placeAll(anim){let m=metrics();actors.forEach((a,id)=>{let p=posForSlot(slotFor[id]);a.style.width=p.w+'px';if(!anim)a.style.transition='none';a.style.left=p.x+'px';a.style.top=p.y+'px'});if(!anim)requestAnimationFrame(()=>actors.forEach(a=>a.style.transition=''))}
function sparkAt(actor,good){let r=actor.getBoundingClientRect(),sr=stage.getBoundingClientRect();for(let i=0;i<7;i++){let e=document.createElement('i');e.className='spark';e.textContent=good?(i%2?'✨':'🌼'):'💥';e.style.left=(r.left-sr.left+r.width*(.2+Math.random()*.6))+'px';e.style.top=(r.top-sr.top+r.height*.25)+'px';e.style.animationDelay=(Math.random()*.15)+'s';stage.appendChild(e);setTimeout(()=>e.remove(),900)}}
async function feed(){let p=posForSlot(slotFor[target]),m=metrics();tteok.style.display='block';tteok.style.left='0';tteok.style.top='0';let sx=m.w*.5-24,sy=88,ex=p.x+p.w*.52-24,ey=p.y+p.h*.19;let a=tteok.animate([{transform:'translate('+sx+'px,'+sy+'px) rotate(-10deg) scale(.8)'},{transform:'translate('+((sx+ex)/2)+'px,'+(sy-32)+'px) rotate(130deg) scale(1.1)'},{transform:'translate('+ex+'px,'+ey+'px) rotate(280deg) scale(.85)'}],{duration:850,easing:'cubic-bezier(.2,.8,.2,1)'});await a.finished;tteok.style.display='none';actors[target].classList.add('peek');actors[target].animate([{transform:'scale(1)'},{transform:'scale(1.08) translateY(-8px)'},{transform:'scale(1)'}],{duration:520});bubble.style.left=(ex+28)+'px';bubble.style.top=(ey-20)+'px';bubble.style.opacity='1';bubble.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1.15)',opacity:1},{transform:'scale(1)',opacity:1}],{duration:320});sfx('eat');mTalk('냠! 누군지 기억해!',1000);await sleep(700);bubble.style.opacity='0';actors[target].classList.remove('peek')}
async function moveActors(ids,newSlots,dur){let starts=ids.map(id=>posForSlot(slotFor[id])),ends=newSlots.map(s=>posForSlot(s));let anims=ids.map((id,k)=>{let a=actors[id],s=starts[k],e=ends[k],arc=35+Math.random()*30;return a.animate([{left:s.x+'px',top:s.y+'px',transform:'translateY(0) scale(1)'},{left:((s.x+e.x)/2)+'px',top:((s.y+e.y)/2)+'px',transform:'translateY(-'+arc+'px) scale(1.04)'},{left:e.x+'px',top:e.y+'px',transform:'translateY(0) scale(1)'}],{duration:dur,easing:'cubic-bezier(.35,.02,.24,1)'})});sfx('move');await Promise.all(anims.map(a=>a.finished));ids.forEach((id,k)=>slotFor[id]=newSlots[k]);placeAll(false)}
async function swapMove(){let n=actors.length,a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*n);while(b===a)b=Math.floor(Math.random()*n);let sa=slotFor[a],sb=slotFor[b];await moveActors([a,b],[sb,sa],Math.max(250,520-round*22))}
async function tripleMove(){let n=actors.length;if(n<4)return swapMove();let pool=[...Array(n).keys()].sort(()=>Math.random()-.5).slice(0,3),s=pool.map(id=>slotFor[id]);await moveActors(pool,[s[1],s[2],s[0]],Math.max(280,560-round*20))}
async function fakeMove(){let n=actors.length,ids=[...Array(n).keys()].sort(()=>Math.random()-.5).slice(0,2);let d=Math.max(240,420-round*15);let aa=ids.map(id=>actors[id].animate([{transform:'translateY(0)'},{transform:'translateY(-45px) rotate('+(id%2?5:-5)+'deg)'},{transform:'translateY(0)'}],{duration:d,easing:'ease-in-out'}));sfx('move');await Promise.all(aa.map(x=>x.finished))}
async function shuffle(){let steps=Math.min(15,5+round);for(let i=0;i<steps;i++){let r=Math.random();if(round>=6&&r<.18)await fakeMove();else if(round>=4&&r<.45)await tripleMove();else await swapMove();await sleep(Math.max(45,120-round*7))}}
function enable(){canPick=true;actors.forEach(a=>a.disabled=false)}
function disable(){canPick=false;actors.forEach(a=>a.disabled=true)}
function startTimer(){let total=Math.max(4200,7600-round*210),st=performance.now();clearInterval(timer);timer=setInterval(()=>{let left=Math.max(0,1-(performance.now()-st)/total);bar.style.width=(left*100)+'%';if(left<=0){clearInterval(timer);timeout()}},70)}
async function roundStart(){clearInterval(timer);canPick=false;bar.style.width='100%';update();makeActors();target=Math.floor(Math.random()*actors.length);say('잘 봐! 꿀떡이 날아갑니다 🍯');await sleep(700);await feed();say('달타들이 움직이기 시작해!');await sleep(350);await shuffle();say('꿀떡 먹은 달타는 누구? 👀');mTalk('달타를 직접 눌러!',950);enable();startTimer()}
async function pick(id,a){if(!canPick)return;disable();clearInterval(timer);if(id===target){combo++;score+=100+combo*30;a.classList.add('correct');sparkAt(a,true);sfx('ok');say(combo>=3?'정답! '+combo+' COMBO 🔥':'정답! 달타잘알! 🎉');mTalk('정답이다!',900);update();await sleep(900);a.classList.remove('correct');round++;roundStart()}else{a.classList.add('wrong');actors[target].classList.add('correct');sparkAt(a,false);sparkAt(actors[target],true);sfx('bad');lives--;combo=0;update();say('땡! 저 달타가 꿀떡을 먹었어!');mTalk('앗! 다시 집중!',1000);await sleep(1100);a.classList.remove('wrong');actors[target].classList.remove('correct');if(lives<=0)over();else roundStart()}}
async function timeout(){if(!canPick)return;disable();actors[target].classList.add('correct');sparkAt(actors[target],true);lives--;combo=0;update();say('시간 초과! 저 달타였어 ⏰');sfx('bad');await sleep(1000);actors[target].classList.remove('correct');if(lives<=0)over();else roundStart()}
function over(){let best=Math.max(score,Number(localStorage.getItem('kkultteokFlashBest')||0));localStorage.setItem('kkultteokFlashBest',best);document.getElementById('result').innerHTML='최종 점수 <b>'+score+'</b>점<br>도달 라운드 <b>'+round+'</b><br>최고 기록 <b>'+best+'</b>점';document.getElementById('over').classList.add('on')}
function start(){round=1;score=0;combo=0;lives=3;document.getElementById('start').style.display='none';document.getElementById('over').classList.remove('on');update();roundStart()}
document.getElementById('startBtn').onclick=start;document.getElementById('again').onclick=start;
document.getElementById('sound').onclick=function(){muted=!muted;this.textContent=muted?'🔇 OFF':'🔊 ON'};
addEventListener('resize',()=>{if(actors.length&&!canPick)placeAll(false)});
</script>
</body></html>
